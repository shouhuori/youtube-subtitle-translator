<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>YouTube Subtitle Translator, Transcript &amp; Summary</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon128.png" width="44" height="44" alt="">
    <div><h1>YouTube Subtitle Translator</h1><p>Transcript &amp; Summary</p></div>
  </header>
  <main>
    <p class="intro">看双语字幕，把视频整理成文字。</p>
    <button id="subtitlesBtn" class="primary"><span>字幕翻译</span><span aria-hidden="true">→</span></button>
    <button id="transcriptBtn" class="secondary"><span>视频转写与总结</span><span aria-hidden="true">→</span></button>
    <p class="hint">在 YouTube 视频页使用。转写与总结将在 LingRead 中打开。</p>
    <p id="status" role="status" aria-live="polite" hidden></p>
    <form id="languageForm" data-autosave="true" class="language-settings">
      <label for="nativeLanguage">母语（字幕翻译目标）</label>
      <select id="nativeLanguage"></select>
      <p id="languageStatus" role="status" aria-live="polite"></p>
    </form>
    <section class="account" aria-label="LingRead 账号">
      <div><span class="eyebrow">LINGREAD 账号</span><p id="accountLabel">正在读取登录状态</p></div>
      <button id="loginBtn" class="small">登录</button>
      <button id="logoutBtn" class="small" hidden>退出</button>
    </section>
    <p class="shared">与 LingRead 共用账号、点数和视频库。</p>
  </main>
  <footer>
    <button id="libraryBtn">我的视频库</button>
    <span aria-hidden="true">·</span>
    <button id="feedbackBtn">反馈建议</button>
    <span id="version"></span>
  </footer>
  <script src="config.js"></script>
  <script src="languages.js"></script>
  <script src="language-settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
